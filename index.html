<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر رِواء</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5EDE0;--paper:#FBF6EC;--ink:#2B1541;--muted:#7C6A8E;--gold:#B8925A;--line:#E2D3BB;--tint:#EADBC4;--p:#5A2D82;--pd:#2C1047;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170826;--paper:#24103C;--ink:#F3E9DC;--muted:#B9A5CC;--line:#3E2359;--tint:#33194F}}
:root[data-theme="dark"]{--bg:#170826;--paper:#24103C;--ink:#F3E9DC;--muted:#B9A5CC;--line:#3E2359;--tint:#33194F}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(36,12,60,.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,164,104,.5)}
.brand{font-family:'El Messiri','Amiri',serif;font-weight:700;font-size:2rem;line-height:1.3;background:linear-gradient(135deg,#9E7B45,#F6E7BF 40%,#C9A468 70%,#8C6A3F);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.brand.big{font-size:clamp(4rem,18vw,5.5rem);line-height:1.2}
.cartbtn{position:relative;background:none;border:1px solid rgba(233,211,163,.6);border-radius:50%;width:42px;height:42px;cursor:pointer;display:grid;place-items:center}
.cartbtn svg{width:22px;height:22px}
.cartbtn i{position:absolute;top:-5px;inset-inline-start:-5px;min-width:19px;height:19px;border-radius:99px;background:linear-gradient(135deg,#F0DDB0,#B8925A);color:#2C1047;font:700 .72rem/19px 'Tajawal',sans-serif;text-align:center;font-style:normal;padding:0 4px}
.cartbtn i:empty{display:none}
.hero{background:radial-gradient(120% 90% at 50% 0,#5B2C86,#22083D 70%);color:#F3E9DC;padding:30px 16px 44px;display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:center;text-align:center}
.arch{width:min(230px,60vw)}
.txt{max-width:420px}
.txt svg{height:96px}
.txt h1{font:700 1.9rem/1.3 'Amiri',serif;margin:6px 0 4px;color:#F0DDB0}
.txt p{margin:0 0 18px;color:#D9C7EA}
.btn{background:var(--p);color:#F5EDE0;border:0;border-radius:999px;padding:10px 20px;font:700 1rem 'Tajawal',sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.gold{background:linear-gradient(135deg,#F0DDB0,#C9A468 55%,#9E7B45);color:#2C1047;padding:12px 28px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{width:100%;padding:14px;font-size:1.05rem;background:linear-gradient(135deg,#5A2D82,#2C1047);border:1px solid var(--gold)}
.steps{display:flex;justify-content:center;gap:clamp(10px,4vw,40px);padding:22px 12px 6px;flex-wrap:wrap}
.steps div{display:flex;align-items:center;gap:8px;font-size:.92rem}
.steps b{width:30px;height:30px;border-radius:50%;background:var(--pd);color:#F0DDB0;display:grid;place-items:center;border:1px solid var(--gold)}
h2.t{text-align:center;font:700 1.6rem 'Amiri',serif;margin:26px 0 4px}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin-bottom:18px}.rule:before,.rule:after{content:"";width:60px;height:1px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:22px 14px;max-width:980px;margin:0 auto;padding:0 14px 120px}
.frame{border-radius:999px 999px 16px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#F7EEDF),var(--tint));border:1px solid var(--line);padding:34px 14px 14px}
.frame svg{width:100%;height:105px;display:block}
.card h3{margin:10px 4px 0;font-size:1rem}
.card p{margin:0 4px;color:var(--muted);font-size:.83rem;min-height:2.4em}
.row{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 0}
.row b{font-size:1rem}
.sw{display:flex;align-items:center;gap:6px;margin:8px 4px 0;min-height:22px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}.dot.on{box-shadow:0 0 0 2px var(--gold)}.sw small{color:var(--muted);font-size:.8rem}.crow{display:grid;grid-template-columns:52px 1fr 44px;gap:6px;margin:4px 0}.crow .btn{padding:6px}
.add{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);background:var(--pd);color:#F0DDB0;font-size:1.4rem;line-height:1;cursor:pointer}
#bar{position:fixed;inset-inline:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none}
#bar button{pointer-events:auto;display:block;margin:auto;width:100%;max-width:460px;box-shadow:0 10px 30px rgba(30,8,55,.45)}
dialog{border:0;border-top:2px solid var(--gold);border-radius:24px 24px 0 0;background:var(--paper);color:var(--ink);width:min(580px,100vw);max-height:92vh;margin:auto auto 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));font-family:inherit}
dialog::backdrop{background:rgba(20,5,35,.6)}
dialog h2{margin:0 0 8px;font:700 1.4rem 'Amiri',serif}
.line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}.line span:first-child{flex:1}
.q{display:inline-flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:1rem}
label{display:block;margin:10px 0 3px;font-size:.88rem;color:var(--muted)}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=color]{padding:2px;height:40px}input[type=checkbox]{width:auto}
.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.g{font-weight:700;font-size:1.1rem;border-top:1px solid var(--gold);margin-top:6px;padding-top:8px}
.note{font-size:.84rem;color:var(--muted);margin:8px 0}
.prod{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#2C1047;color:#F3E9DC;padding:10px 20px;border-radius:999px;border:1px solid var(--gold);z-index:20;display:none}
footer{text-align:center;padding:0 0 26px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gW" gradientUnits="userSpaceOnUse" x1="80" y1="30" x2="500" y2="310"><stop offset="0" stop-color="#8C6A3F"/><stop offset=".25" stop-color="#E9D3A3"/><stop offset=".45" stop-color="#FFF6D8"/><stop offset=".68" stop-color="#C9A468"/><stop offset="1" stop-color="#7E5C33"/></linearGradient>
<linearGradient id="gG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9E7B45"/><stop offset=".4" stop-color="#F6E7BF"/><stop offset=".7" stop-color="#C9A468"/><stop offset="1" stop-color="#8C6A3F"/></linearGradient>
<g id="word"><path d="M486 118C486 205 450 258 384 262C444 244 466 196 466 118Q476 106 486 118Z"/><path d="M466 274L474 281L440 306L432 299Z"/><path fill-rule="evenodd" d="M294 140a32 30 0 1 0 64 0a32 30 0 1 0 -64 0ZM318 143a12 10 0 1 0 24 0a12 10 0 1 0 -24 0Z"/><path d="M360 150C362 222 320 262 250 258C306 238 340 214 340 160Z"/><path d="M203 36Q207 30 211 36L221 208Q210 217 199 208Z"/><path d="M150 168C124 162 108 184 128 194C138 199 150 199 160 202" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs></svg>

<header>
  <span class="brand">رِواء</span>
  <button class="cartbtn" data-open aria-label="السلة"><svg viewBox="0 0 24 24" fill="none" stroke="#F0DDB0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14l1 11H4z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg><i id="cnt" data-dyn></i></button>
</header>

<section class="hero">
  <svg class="arch" viewBox="0 0 240 300" fill="none">
    <path d="M8 296V118A112 112 0 0 1 232 118V296Z" stroke="url(#gG)" stroke-width="3"/>
    <path d="M20 296V120A100 100 0 0 1 220 120V296" stroke="url(#gG)" stroke-width="1" opacity=".7"/>
    <g transform="translate(120 190) scale(1.25) translate(-100 -100)" stroke="url(#gG)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M40 60H160Q168 60 170 68L182 142Q184 154 172 154H28Q16 154 18 142L30 68Q32 60 40 60Z"/><path d="M72 60V40Q72 14 100 14Q128 14 128 40V60"/><path d="M28 84Q100 116 172 84" stroke-width="2.5"/></g>
    <circle cx="120" cy="204" r="7" fill="url(#gG)"/>
    <path d="M176 60Q178 70 188 72Q178 74 176 84Q174 74 164 72Q174 70 176 60Z" fill="#FFF6D8"/>
  </svg>
  <div class="txt">
    <div class="brand big">رِواء</div>
    <h1>اطلبي شنطتك الآن</h1>
    <p>ثلاث خطوات بسيطة، والدفع عند الاستلام</p>
    <a class="btn gold" href="#shop">تسوّقي المجموعة</a>
  </div>
</section>
<div class="steps"><div><b>١</b>اختاري</div><div><b>٢</b>اكتبي بياناتك</div><div><b>٣</b>أرسلي على واتساب</div></div>

<h2 class="t" id="shop">المجموعة</h2><div class="rule">◆</div>
<main class="grid" id="app" data-dyn></main>
<footer><button class="btn ghost" id="adminBtn" hidden>إدارة المتجر</button></footer>
<div id="bar" data-dyn></div>
<div id="toast"></div>

<dialog id="sheet">
  <h2>طلبك</h2>
  <div id="lines" data-dyn></div><div id="totals" data-dyn></div>
  <label>الاسم</label><input id="fn" autocomplete="name">
  <label>رقم الموبايل</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel">
  <div class="two"><div><label>المدينة / المحافظة</label><input id="fc"></div><div><label>العنوان بالتفصيل</label><input id="fa"></div></div>
  <label>ملاحظات (اختياري)</label><textarea id="fnote" rows="2"></textarea>
  <p class="note">الدفع عند الاستلام. بعد الضغط سيفتح واتساب برسالة الطلب جاهزة، اضغطي إرسال فقط.</p>
  <button class="btn big" id="send">إرسال الطلب</button>
  <textarea id="fallback" rows="6" hidden readonly></textarea>
  <button class="btn ghost" style="margin-top:8px;width:100%" id="closeSheet">رجوع للتسوق</button>
</dialog>

<dialog id="admin">
  <h2>إدارة المتجر</h2>
  <div class="two"><div><label>رقم واتساب لاستلام الطلبات (بالكود الدولي)</label><input id="wa" inputmode="tel" placeholder="مثال: 201001234567"></div><div><label>سعر الشحن (ج.م)</label><input id="ship" type="number" min="0"></div></div>
  <div id="plist" data-dyn></div>
  <button class="btn ghost" id="addP" style="width:100%">+ إضافة منتج</button>
  <p class="note">اضغطي حفظ ليظهر التعديل لكل الزوار.</p>
  <button class="btn big" id="save">حفظ ونشر</button>
  <button class="btn ghost" style="margin-top:8px;width:100%" id="closeAdmin">إغلاق</button>
</dialog>

<script id="state" type="application/json">{"whatsapp":"","ship":60,"products":[
{"id":"p1","name":"شنطة يد كلاسيك","desc":"جلد صناعي فاخر بمقبض مريح","price":850,"color":"#5A2D82","colors":[{"n":"بنفسجي","h":"#5A2D82"},{"n":"بيج","h":"#D9C3A3"},{"n":"ذهبي","h":"#B8925A"}],"on":true},
{"id":"p2","name":"شنطة كروس صغيرة","desc":"خفيفة وعملية للخروج اليومي","price":620,"color":"#D9C3A3","colors":[{"n":"بيج","h":"#D9C3A3"},{"n":"بنفسجي","h":"#5A2D82"}],"on":true},
{"id":"p3","name":"شنطة توتي واسعة","desc":"مساحة كبيرة للعمل والسفر","price":780,"color":"#3B1A5A","on":true},
{"id":"p4","name":"كلتش سهرة","desc":"لمسة أنيقة للمناسبات","price":450,"color":"#B8925A","on":true}]}</script>
<script>
const S=JSON.parse(document.getElementById('state').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ar-EG')+' ج.م';
let cart={};try{cart=JSON.parse(localStorage.getItem('riwaa-cart')||'{}')}catch(e){}
const keep=()=>{try{localStorage.setItem('riwaa-cart',JSON.stringify(cart))}catch(e){}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
const bag=c=>`<svg viewBox="0 0 200 170"><path d="M40 60H160Q168 60 170 68L182 142Q184 154 172 154H28Q16 154 18 142L30 68Q32 60 40 60Z" fill="${esc(c)}"/><path d="M72 60V40Q72 14 100 14Q128 14 128 40V60" fill="none" stroke="${esc(c)}" stroke-width="9" stroke-linecap="round"/><path d="M30 82Q100 112 170 82" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3"/><circle cx="100" cy="102" r="7" fill="#E9D3A3"/></svg>`;
S.products.forEach(p=>{if(!p.colors||!p.colors.length)p.colors=[{n:'',h:p.color||'#5A2D82'}]});
const sel={};
const col=p=>p.colors[Math.min(sel[p.id]||0,p.colors.length-1)];
const items=()=>Object.entries(cart).map(([k,q])=>{const [id,i=0]=k.split('|');const p=S.products.find(x=>x.id===id&&x.on);return p&&p.colors[+i]?[p,q,+i,k]:null}).filter(Boolean);
function render(){
  $('#app').innerHTML=S.products.filter(p=>p.on).map(p=>{const c=col(p),s=sel[p.id]||0;return `<article class="card"><div class="frame" style="--c:${esc(c.h)}">${bag(c.h)}</div><div class="sw">${p.colors.length>1?p.colors.map((x,i)=>`<button class="dot${i===s?' on':''}" style="background:${esc(x.h)}" data-sw="${p.id}:${i}" aria-label="${esc(x.n||'لون')}"></button>`).join(''):''}<small>${esc(c.n||'')}</small></div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="row"><b>${fmt(p.price)}</b><button class="add" data-pick="${p.id}" aria-label="أضيفي للسلة">+</button></div></article>`}).join('');
  const it=items(),n=it.reduce((a,[,q])=>a+q,0);
  $('#cnt').textContent=n||'';
  $('#bar').innerHTML=n?`<button class="btn big" data-open>عرض السلة (${n}) · ${fmt(it.reduce((a,[p,q])=>a+p.price*q,0))}</button>`:'';
}
function sheet(){
  const it=items();
  $('#lines').innerHTML=it.map(([p,q,i,k])=>`<div class="line"><span>${esc(p.name)}${p.colors[i].n?' · '+esc(p.colors[i].n):''}</span><span class="q"><button data-dec="${k}">−</button>${q}<button data-add="${k}" data-stay>+</button></span><span>${fmt(p.price*q)}</span></div>`).join('')||'<p class="note">السلة فارغة</p>';
  const sub=it.reduce((a,[p,q])=>a+p.price*q,0),sh=it.length?S.ship:0;
  $('#totals').innerHTML=`<div class="tot"><span>المنتجات</span><span>${fmt(sub)}</span></div><div class="tot"><span>الشحن</span><span>${fmt(sh)}</span></div><div class="tot g"><span>الإجمالي</span><span>${fmt(sub+sh)}</span></div>`;
}
function message(){
  const it=items(),sub=it.reduce((a,[p,q])=>a+p.price*q,0);
  return ['طلب جديد من متجر رِواء','',`الاسم: ${$('#fn').value}`,`الموبايل: ${$('#fp').value}`,`المدينة: ${$('#fc').value}`,`العنوان: ${$('#fa').value}`,'','الطلبات:',...it.map(([p,q,i])=>`- ${p.name}${p.colors[i].n?' ('+p.colors[i].n+')':''} × ${q} = ${p.price*q} ج.م`),'',`الشحن: ${S.ship} ج.م`,`الإجمالي: ${sub+S.ship} ج.م`,'الدفع: عند الاستلام',$('#fnote').value?`ملاحظات: ${$('#fnote').value}`:''].join('\n');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.pick){const k=d.pick+'|'+(sel[d.pick]||0);cart[k]=(cart[k]||0)+1;keep();render();toast('تمت الإضافة للسلة');}
  else if(d.sw){const [id,i]=d.sw.split(':');sel[id]=+i;render();}
  else if(d.add){cart[d.add]=(cart[d.add]||0)+1;keep();render();sheet();}
  else if(d.dec){cart[d.dec]=(cart[d.dec]||1)-1;if(cart[d.dec]<=0)delete cart[d.dec];keep();render();sheet();if(!items().length)$('#sheet').close();}
  else if('open' in d){sheet();$('#sheet').showModal();}
  else if(t.id==='closeSheet')$('#sheet').close();
  else if(t.id==='send'){
    if(!items().length)return toast('السلة فارغة');
    if(!$('#fn').value.trim()||!$('#fp').value.trim()||!$('#fa').value.trim())return toast('من فضلك اكتبي الاسم والموبايل والعنوان');
    const m=message();
    if(S.whatsapp){window.open('https://wa.me/'+S.whatsapp+'?text='+encodeURIComponent(m),'_blank');}
    else{const f=$('#fallback');f.value=m;f.hidden=false;f.select();try{navigator.clipboard.writeText(m)}catch(x){}toast('تم نسخ الطلب، أرسليه للمتجر');}
  }
});
/* ---------- Owner tools (only for the page owner/editor) ---------- */
let A=null;
function plist(){
  $('#plist').innerHTML=S.products.map((p,i)=>`<div class="prod"><div class="two"><div><label>الاسم</label><input data-i="${i}" data-k="name" value="${esc(p.name)}"></div><div><label>السعر</label><input type="number" data-i="${i}" data-k="price" value="${p.price}"></div></div><label>وصف قصير</label><input data-i="${i}" data-k="desc" value="${esc(p.desc)}"><label>الألوان المتاحة</label>${p.colors.map((c,j)=>`<div class="crow"><input type="color" data-i="${i}" data-j="${j}" data-k="h" value="${esc(c.h)}"><input placeholder="اسم اللون" data-i="${i}" data-j="${j}" data-k="n" value="${esc(c.n||'')}"><button class="btn ghost" data-delc="${i}:${j}">×</button></div>`).join('')}<button class="btn ghost" data-addc="${i}">+ لون</button><div class="two" style="margin-top:8px"><label><input type="checkbox" data-i="${i}" data-k="on" ${p.on?'checked':''}> متاح للطلب</label><button class="btn ghost" data-del="${i}">حذف المنتج</button></div></div>`).join('');
}
document.addEventListener('input',e=>{
  const t=e.target,i=t.dataset.i;if(i===undefined)return;
  const v=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;if(t.dataset.j!==undefined)S.products[i].colors[+t.dataset.j][t.dataset.k]=v;else S.products[i][t.dataset.k]=v;
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.del!==undefined&&confirm('حذف المنتج؟')){S.products.splice(+t.dataset.del,1);plist();}
  else if(t.id==='addP'){S.products.push({id:'p'+Date.now(),name:'منتج جديد',desc:'',price:0,colors:[{n:'',h:'#5A2D82'}],on:true});plist();}
  else if(t.dataset.addc!==undefined){S.products[+t.dataset.addc].colors.push({n:'',h:'#D9C3A3'});plist();}
  else if(t.dataset.delc!==undefined){const [a,b]=t.dataset.delc.split(':').map(Number);if(S.products[a].colors.length>1){S.products[a].colors.splice(b,1);plist();}else toast('لازم يبقى لون واحد على الأقل');}
  else if(t.id==='closeAdmin')$('#admin').close();
  else if(t.id==='save')publish();
});
$('#adminBtn').onclick=()=>{$('#wa').value=S.whatsapp;$('#ship').value=S.ship;plist();$('#admin').showModal();};
async function publish(){
  S.whatsapp=$('#wa').value.replace(/\D/g,'');S.ship=+$('#ship').value||0;
  const c=document.documentElement.cloneNode(true);
  c.querySelectorAll('[data-dyn]').forEach(e=>e.innerHTML='');
  c.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));
  c.querySelector('#adminBtn').setAttribute('hidden','');
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
